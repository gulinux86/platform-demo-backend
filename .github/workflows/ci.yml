name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Test & Lint — runs on every push and PR
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app/

      - name: Test
        run: pytest --cov=app --cov-report=xml tests/
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          API_SECRET_KEY: test-secret-key

  # ─────────────────────────────────────────────────────────────────────────────
  # Build — produces the Docker image (runs after test, on push only)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    outputs:
      image_hml: ${{ steps.tags.outputs.image_hml }}
      image_prod: ${{ steps.tags.outputs.image_prod }}
      short_sha: ${{ steps.tags.outputs.short_sha }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_hml=us-central1-docker.pkg.dev/${{ secrets.HML_PROJECT_ID }}/app-hml-services/backend:develop-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_prod=us-central1-docker.pkg.dev/${{ secrets.PROD_PROJECT_ID }}/app-prod-services/backend:${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: docker build -t backend-local .

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy HML — auto on every merge to develop
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-hml:
    name: Deploy HML
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: hml

    concurrency:
      group: deploy-backend-hml
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f
        with:
          workload_identity_provider: ${{ secrets.HML_WIF_PROVIDER }}
          service_account: ${{ secrets.HML_WIF_SA }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & push image
        run: |
          IMAGE="${{ needs.build.outputs.image_hml }}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backend \
            --image="${{ needs.build.outputs.image_hml }}" \
            --region=us-central1 \
            --project="${{ secrets.HML_PROJECT_ID }}" \
            --quiet

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy PROD — gated on every merge to main (requires reviewer approval)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy PROD
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: prod

    concurrency:
      group: deploy-backend-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f
        with:
          workload_identity_provider: ${{ secrets.PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.PROD_WIF_SA }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & push image
        run: |
          IMAGE="${{ needs.build.outputs.image_prod }}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backend \
            --image="${{ needs.build.outputs.image_prod }}" \
            --region=us-central1 \
            --project="${{ secrets.PROD_PROJECT_ID }}" \
            --quiet
